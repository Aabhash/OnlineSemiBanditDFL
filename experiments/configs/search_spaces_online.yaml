agents:

  # === Baselines (scalar knobs only) ===

  LinUCB:
    tune_lr: false
    alpha:
      type: float
      low: 0.1
      high: 5.0
      log: true
    lambda_reg:
      type: float
      low: 0.01
      high: 10.0
      log: true

  UCB-Bayesian:
    tune_lr: false
    beta:
      type: float
      low: 0.1
      high: 5.0
      log: true

  TS:
    tune_lr: false
    prior_var:
      type: float
      low: 0.1
      high: 10.0
      log: true
    noise_var:
      type: float
      low: 0.01
      high: 1.0
      log: true

  EpsilonGreedy:
    tune_lr: true
    init_lr:
      type: categorical
      choices: [0.0003, 0.001, 0.003]
    epsilon:
      type: float
      low: 0.01
      high: 0.3
      log: true
    decay_epsilon:
      type: categorical
      choices: [true, false]
    hidden_dim:
      type: categorical
      choices: [8, 16, 32]

  # === Neural baseline ===

  NeuralUCB:
    tune_lr: true
    init_lr:
      type: categorical
      choices: [0.0003, 0.001, 0.003]
    alpha:
      type: float
      low: 0.1
      high: 5.0
      log: true
    lambda_reg:
      type: float
      low: 0.01
      high: 10.0
      log: true
    hidden_dim:
      type: categorical
      choices: [8, 16, 32]

  # === Bayesian backbone agents (shared search space) ===

  BayesianSPO:
    tune_lr: true
    init_lr:
      type: categorical
      choices: [0.0003, 0.001, 0.003]
    beta:
      type: float
      low: 0.1
      high: 5.0
      log: true
    hidden_dim:
      type: categorical
      choices: [8, 16, 32]
    lambda_reg:
      type: float
      low: 0.01
      high: 10.0
      log: true

  BayesianPFY:
    tune_lr: true
    init_lr:
      type: categorical
      choices: [0.0003, 0.001, 0.003]
    beta:
      type: float
      low: 0.1
      high: 5.0
      log: true
    hidden_dim:
      type: categorical
      choices: [8, 16, 32]
    lambda_reg:
      type: float
      low: 0.01
      high: 10.0
      log: true

  BayesianMSE:
    tune_lr: true
    init_lr:
      type: categorical
      choices: [0.0003, 0.001, 0.003]
    beta:
      type: float
      low: 0.1
      high: 5.0
      log: true
    hidden_dim:
      type: categorical
      choices: [8, 16, 32]
    lambda_reg:
      type: float
      low: 0.01
      high: 10.0
      log: true

  # === Weber (backbone + method-specific knobs) ===

  WeberBLL-Online:
    tune_lr: true
    init_lr:
      type: categorical
      choices: [0.0003, 0.001, 0.003]
    beta:
      type: float
      low: 0.1
      high: 5.0
      log: true
    hidden_dim:
      type: categorical
      choices: [8, 16, 32]
    lambda_reg:
      type: float
      low: 0.01
      high: 10.0
      log: true
    noise_var:
      type: float
      low: 0.1
      high: 10.0
      log: true
    fisher_beta:
      type: float
      low: 0.001
      high: 1.0
      log: true
    phase_length:
      type: categorical
      choices: [25, 50, 100]
    phase_epochs:
      type: categorical
      choices: [3, 5, 10]

