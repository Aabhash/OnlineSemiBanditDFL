agents:

  # === Baselines (scalar knobs only) ===

  LinUCB:
    tune_lr: false
    alpha:
      type: float
      low: 0.1
      high: 5.0
      log: true
    lambda_reg:
      type: float
      low: 0.01
      high: 10.0
      log: true

  TS:
    tune_lr: false
    prior_var:
      type: float
      low: 0.1
      high: 10.0
      log: true
    noise_var:
      type: float
      low: 0.01
      high: 1.0
      log: true

  EpsilonGreedy:
    tune_lr: true
    init_lr:
      type: categorical
      choices: [0.0003, 0.001, 0.003]
    epsilon:
      type: float
      low: 0.01
      high: 0.3
      log: true
    decay_epsilon:
      type: categorical
      choices: [true, false]
    hidden_dim:
      type: categorical
      choices: [8, 16, 32]

  # === Neural baseline ===

  NeuralUCB:
    tune_lr: true
    init_lr:
      type: categorical
      choices: [0.0003, 0.001, 0.003]
    alpha:
      type: float
      low: 0.1
      high: 5.0
      log: true
    lambda_reg:
      type: float
      low: 0.01
      high: 10.0
      log: true
    batch_size:
      type: categorical
      choices: [4, 8, 16]
    hidden_dim:
      type: categorical
      choices: [8, 16, 32]

  # === Bayesian backbone agents (shared search space) ===

  BayesianSPO:
    tune_lr: true
    init_lr:
      type: categorical
      choices: [0.0003, 0.001, 0.003, 0.006, 0.012]
    beta:
      type: float
      low: 0.1
      high: 5.0
      log: true
    hidden_dim:
      type: categorical
      choices: [8, 16, 32]
    nonlinear_depth:
      type: categorical
      choices: [0, 1, 3, 5]
    residual_gate_scale:
      type: categorical
      choices: [0.1, 0.25, 0.5, 1.0, 2.0]
    lambda_reg:
      type: float
      low: 0.01
      high: 10.0
      log: true
    imputation_samples:
      type: categorical
      choices: [1, 2, 4]

  BayesianPFY:
    tune_lr: true
    init_lr:
      type: categorical
      choices: [0.0003, 0.001, 0.003]
    beta:
      type: float
      low: 0.1
      high: 5.0
      log: true
    hidden_dim:
      type: categorical
      choices: [8, 16, 32]
    lambda_reg:
      type: float
      low: 0.01
      high: 10.0
      log: true
    imputation_samples:
      type: categorical
      choices: [1, 2, 4]
    pfy_n_samples:
      type: categorical
      choices: [1, 2]
    pfy_sigma:
      type: float
      low: 0.1
      high: 10.0
      log: true
    pfy_noise:
      type: categorical
      choices: [gumbel, normal]

  BayesianMSE:
    tune_lr: true
    init_lr:
      type: categorical
      choices: [0.0003, 0.001, 0.003, 0.006, 0.012]
    beta:
      type: float
      low: 0.1
      high: 5.0
      log: true
    hidden_dim:
      type: categorical
      choices: [8, 16, 32]
    nonlinear_depth:
      type: categorical
      choices: [0, 1, 3, 5]
    residual_gate_scale:
      type: categorical
      choices: [0.1, 0.25, 0.5, 1.0, 2.0]
    lambda_reg:
      type: float
      low: 0.01
      high: 10.0
      log: true

  # === Weber (backbone + method-specific knobs) ===

  WeberBLL-Online:
    tune_lr: true
    init_lr:
      type: categorical
      choices: [0.0003, 0.001, 0.003]
    beta:
      type: float
      low: 0.1
      high: 5.0
      log: true
    hidden_dim:
      type: categorical
      choices: [8, 16, 32]
    lambda_reg:
      type: float
      low: 0.01
      high: 10.0
      log: true
    noise_var:
      type: float
      low: 0.1
      high: 10.0
      log: true
