agents:
  EpsilonGreedy:
    tune_lr: true
    lr:
      type: float
      low: 0.0001
      high: 0.1
      log: true
    epsilon:
      type: float
      low: 0.01
      high: 0.3
      log: true
    decay_epsilon:
      type: categorical
      choices: [true, false]
    hidden_dim:
      type: categorical
      choices: [32, 64]

  Greedy:
    tune_lr: true
    lr:
      type: float
      low: 0.0001
      high: 0.1
      log: true
    hidden_dim:
      type: categorical
      choices: [32, 64]

  Random:
    tune_lr: false

  LinUCB:
    tune_lr: false
    alpha:
      type: float
      low: 0.1
      high: 5.0
      log: true
    lambda_reg:
      type: float
      low: 0.01
      high: 10.0
      log: true

  NeuralUCB:
    tune_lr: true
    lr:
      type: float
      low: 0.0001
      high: 0.1
      log: true
    alpha:
      type: float
      low: 0.1
      high: 5.0
      log: true
    lambda_reg:
      type: float
      low: 0.01
      high: 10.0
      log: true
    hidden_dim:
      type: categorical
      choices: [32, 64]

  UCB-Bayesian:
    tune_lr: false
    beta:
      type: float
      low: 0.1
      high: 5.0
      log: true

  ThompsonSampling:
    tune_lr: false
    prior_var:
      type: float
      low: 0.1
      high: 10.0
      log: true
    noise_var:
      type: float
      low: 0.01
      high: 1.0
      log: true

  BayesianMSE:
    tune_lr: true
    lr:
      type: float
      low: 0.0001
      high: 0.1
      log: true
    beta:
      type: float
      low: 0.1
      high: 5.0
      log: true
    hidden_dim:
      type: categorical
      choices: [32, 64]
    lambda_reg:
      type: float
      low: 0.01
      high: 10.0
      log: true

  BayesianSPO:
    tune_lr: true
    lr:
      type: float
      low: 0.0001
      high: 0.1
      log: true
    beta:
      type: float
      low: 0.1
      high: 5.0
      log: true
    hidden_dim:
      type: categorical
      choices: [32, 64]
    lambda_reg:
      type: float
      low: 0.01
      high: 10.0
      log: true
