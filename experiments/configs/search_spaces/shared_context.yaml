agents:
  EpsilonGreedy:
    tune_lr: true
    init_lr:
      type: categorical
      choices: [0.0003, 0.001, 0.003]
    epsilon:
      type: float
      low: 0.01
      high: 0.3
      log: true
    decay_epsilon:
      type: categorical
      choices: [true, false]
    hidden_dim:
      type: categorical
      choices: [8, 16, 32]

  Greedy:
