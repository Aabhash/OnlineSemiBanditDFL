agents:
  BayesianSPO:
    tune_lr: true
    lr:
      type: float
      low: 0.0001
      high: 0.1
      log: true
    beta:
      type: float
      low: 0.1
      high: 5.0
      log: true
    alpha:
      type: float
      low: 0.0
      high: 0.5
    hidden_dim:
      type: categorical
      choices: [32, 64, 128]
    lambda_reg:
      type: float
      low: 0.01
      high: 10.0
      log: true

  FullSPO:
    tune_lr: true
    lr:
      type: float
      low: 0.0001
      high: 0.1
      log: true
    beta_start:
      type: float
      low: 0.1
      high: 5.0
      log: true
    beta_end:
      type: float
      low: 0.01
      high: 1.0
      log: true
    hidden_dim:
      type: categorical
      choices: [32, 64, 128]
    lambda_reg:
      type: float
      low: 0.01
      high: 10.0
      log: true

  DecisionUCB:
    tune_lr: true
    lr:
      type: float
      low: 0.0001
      high: 0.1
      log: true
    beta_pred_start:
      type: float
      low: 0.1
      high: 5.0
      log: true
    beta_pred_end:
      type: float
      low: 0.01
      high: 1.0
      log: true
    beta_decision:
      type: float
      low: 0.1
      high: 3.0
      log: true
    hidden_dim:
      type: categorical
      choices: [32, 64, 128]

  LinUCB:
    tune_lr: false
    alpha:
      type: float
      low: 0.1
      high: 5.0
      log: true
    lambda_reg:
      type: float
      low: 0.01
      high: 10.0
      log: true

  NeuralUCB:
    tune_lr: true
    lr:
      type: float
      low: 0.0001
      high: 0.1
      log: true
    alpha:
      type: float
      low: 0.1
      high: 5.0
      log: true
    lambda_reg:
      type: float
      low: 0.01
      high: 10.0
      log: true
    hidden_dim:
      type: categorical
      choices: [32, 64, 128]

  UCB-Bayesian:
    tune_lr: false
    beta:
      type: float
      low: 0.1
      high: 5.0
      log: true

  ThompsonSampling:
    tune_lr: false
    # No hyperparameters to tune

  MSENeural:
    tune_lr: true
    lr:
      type: float
      low: 0.0001
      high: 0.1
      log: true
    beta:
      type: float
      low: 0.1
      high: 5.0
      log: true
    hidden_dim:
      type: categorical
      choices: [32, 64, 128]
    lambda_reg:
      type: float
      low: 0.01
      high: 10.0
      log: true

  EpsilonGreedy:
    tune_lr: true
    lr:
      type: float
      low: 0.0001
      high: 0.1
      log: true
    epsilon:
      type: float
      low: 0.01
      high: 0.3
      log: true
    decay_epsilon:
      type: categorical
      choices: [true, false]
    hidden_dim:
      type: categorical
      choices: [32, 64, 128]

  Greedy:
    tune_lr: true
    lr:
      type: float
      low: 0.0001
      high: 0.1
      log: true
    hidden_dim:
      type: categorical
      choices: [32, 64, 128]

  Random:
    tune_lr: false
