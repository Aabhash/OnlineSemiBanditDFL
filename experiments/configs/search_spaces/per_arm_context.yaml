agents:

  PerArmThompsonSampling:
    tune_lr: false
    # No hyperparameters to tune

  PerArmEpsilonGreedy:
    tune_lr: true
    lr:
      type: float
      low: 0.0001
      high: 0.1
      log: true
    epsilon:
      type: float
      low: 0.01
      high: 0.3
      log: true
    decay_epsilon:
      type: categorical
      choices: [true, false]
    hidden_dim:
      type: categorical
      choices: [32, 64, 128]

  PerArmGreedy:
    tune_lr: true
    lr:
      type: float
      low: 0.0001
      high: 0.1
      log: true
    hidden_dim:
      type: categorical
      choices: [32, 64, 128]

  PerArmRandom:
    tune_lr: false

  CN-UCB:
    tune_lr: true
    lr:
      type: float
      low: 0.0001
      high: 0.1
      log: true
    gamma:
      type: float
      low: 0.1
      high: 5.0
      log: true
    lambda_reg:
      type: float
      low: 0.01
      high: 10.0
      log: true
    hidden_dim:
      type: categorical
      choices: [32, 64, 128]
    train_interval:
      type: int
      low: 1
      high: 20
    train_epochs:
      type: int
      low: 5
      high: 100

  CN-TS:
    tune_lr: true
    lr:
      type: float
      low: 0.0001
      high: 0.1
      log: true
    nu:
      type: float
      low: 0.1
      high: 5.0
      log: true
    lambda_reg:
      type: float
      low: 0.01
      high: 10.0
      log: true
    hidden_dim:
      type: categorical
      choices: [32, 64, 128]
    train_interval:
      type: int
      low: 1
      high: 20
    train_epochs:
      type: int
      low: 5
      high: 100

  PerArmLinUCB:
    tune_lr: false
    alpha:
      type: float
      low: 0.1
      high: 5.0
      log: true
    lambda_reg:
      type: float
      low: 0.01
      high: 10.0
      log: true

  PerArmNeuralUCB:
    tune_lr: true
    lr:
      type: float
      low: 0.0001
      high: 0.1
      log: true
    alpha:
      type: float
      low: 0.1
      high: 5.0
      log: true
    lambda_reg:
      type: float
      low: 0.01
      high: 10.0
      log: true
    hidden_dim:
      type: categorical
      choices: [32, 64, 128]

  PerArmMSENeural:
    tune_lr: true
    lr:
      type: float
      low: 0.0001
      high: 0.1
      log: true
    beta:
      type: float
      low: 0.1
      high: 5.0
      log: true
    hidden_dim:
      type: categorical
      choices: [32, 64, 128]
    lambda_reg:
      type: float
      low: 0.01
      high: 10.0
      log: true

  PerArmBayesianSPO:
    tune_lr: true
    lr:
      type: float
      low: 0.0001
      high: 0.1
      log: true
    beta_start:
      type: float
      low: 0.1
      high: 5.0
      log: true
    beta_end:
      type: float
      low: 0.01
      high: 1.0
      log: true
    hidden_dim:
      type: categorical
      choices: [32, 64, 128]
    lambda_reg:
      type: float
      low: 0.01
      high: 10.0
      log: true

