agents:

  PerArmThompsonSampling:
    tune_lr: false
    lambda_reg:
      type: float
      low: 0.1
      high: 10.0
      log: true
    sigma:
      type: float
      low: 0.1
      high: 5.0
      log: true

  PerArmEpsilonGreedy:
    tune_lr: true
    lr:
      type: float
      low: 0.0001
      high: 0.1
      log: true
    epsilon:
      type: float
      low: 0.01
      high: 0.3
      log: true
    decay_epsilon:
      type: categorical
      choices: [true, false]
    hidden_dim:
      type: categorical
      choices: [32, 64]

  PerArmGreedy:
    tune_lr: true
    lr:
      type: float
      low: 0.0001
      high: 0.1
      log: true
    hidden_dim:
      type: categorical
      choices: [32, 64]

  PerArmRandom:
    tune_lr: false

  CN-UCB:
    tune_lr: true
    lr:
      type: float
      low: 0.0001
      high: 0.1
      log: true
    gamma:
      type: float
      low: 0.1
      high: 5.0
      log: true
    lambda_reg:
      type: float
      low: 0.01
      high: 10.0
      log: true
    hidden_dim:
      type: categorical
      choices: [32, 64]
    train_interval:
      type: int
      low: 1
      high: 20
    train_epochs:
      type: int
      low: 5
      high: 100
    use_lr_schedule:
      type: categorical
      choices: [true, false]

  CN-TS:
    tune_lr: true
    lr:
      type: float
      low: 0.0001
      high: 0.1
      log: true
    nu:
      type: float
      low: 0.1
      high: 5.0
      log: true
    lambda_reg:
      type: float
      low: 0.01
      high: 10.0
      log: true
    hidden_dim:
      type: categorical
      choices: [32, 64]
    train_interval:
      type: int
      low: 1
      high: 20
    train_epochs:
      type: int
      low: 5
      high: 100
    use_lr_schedule:
      type: categorical
      choices: [true, false]

  PerArmLinUCB:
    tune_lr: false
    alpha:
      type: float
      low: 0.1
      high: 5.0
      log: true
    lambda_reg:
      type: float
      low: 0.01
      high: 10.0
      log: true

  PerArmNeuralLinUCB:
    tune_lr: false
    alpha:
      type: float
      low: 0.1
      high: 5.0
      log: true
    lambda_reg:
      type: float
      low: 0.01
      high: 10.0
      log: true
    hidden_dim:
      type: categorical
      choices: [32, 64]

  PerArmBayesianMSE:
    tune_lr: true
    lr:
      type: float
      low: 0.0001
      high: 0.1
      log: true
    beta:
      type: float
      low: 0.1
      high: 5.0
      log: true
    hidden_dim:
      type: categorical
      choices: [32, 64]
    lambda_reg:
      type: float
      low: 0.01
      high: 10.0
      log: true

  PerArmBayesianSPO:
    tune_lr: true
    lr:
      type: float
      low: 0.0001
      high: 0.1
      log: true
    beta:
      type: float
      low: 0.1
      high: 5.0
      log: true
    hidden_dim:
      type: categorical
      choices: [32, 64]
    lambda_reg:
      type: float
      low: 0.01
      high: 10.0
      log: true
