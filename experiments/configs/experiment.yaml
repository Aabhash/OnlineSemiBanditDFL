experiment:
  name: "bandit_hp_tuning"
  output_dir: "results/tuning"

tuning:
  n_trials: 50
  n_seeds: 3
  n_rounds: 2000
  timeout_per_trial: 3600
  sampler_seed: 42
  default_lr: 0.01
  # Seed-aware pruning: prune trials that are clearly worse than median
  pruning:
    enabled: true
    min_seeds_before_pruning: 1  # Run at least 2 seeds before pruning
    warmup_trials: 5             # Don't prune first N trials (need baseline)
    percentile_threshold: 75     # Prune if worse than this percentile of completed trials
    # Late-stage pruning: only consider performance in the last fraction of rounds
    # This prevents pruning exploration-heavy configs before they can exploit
    use_late_stage: true         # If true, prune based on late-stage regret only
    late_stage_fraction: 0.75    # Consider only last 25% of rounds for pruning

validation:
  eval_interval: 25
  # For synthetic envs: generate validation set for monitoring (not HP selection)
  n_val_samples: 100
  seed: 42

compute:
  use_gpu: false
  track_time: true
  max_parallel_trials: 1

wandb:
  enabled: true
  entity: null
  log_interval: 10
  evaluation:
    project: "constrained-bandits-eval"
    tags: ["evaluation"]

storage:
  database: "sqlite:///results/tuning/optuna.db"
  results_dir: "results/tuning/trials"

# Disjoint seed sets to avoid data leakage between HP tuning and final evaluation
tuning_seeds: [0, 1, 2]            # Seeds for HP tuning (3 seeds)
evaluation_seeds: [100, 101, 102, 103, 104, 105, 106, 107, 108, 109]  # Seeds for final eval (10 seeds)

analysis:
  bootstrap:
    n_bootstrap: 10000
    confidence: 0.95
    seed: 42
  significance:
    alpha: 0.05

datasets:


  # Portfolio with 32 items,
  portfolio_32:
    num_assets: 32
    max_assets: 5
    context_dim: 5
    noise_width: 0.25
    signal_scale: 0.05
    baseline_return: 0.10
    gamma: 1.0
    solver_time_limit: 0.1
    env_type: shared_context


  # Knapsack with 32 items, heterogeneous weights (uniform [1, 5])
  knapsack_32:
    n_items: 32
    context_dim: 5
    capacity: 20.0
    noise_width: 0.25
    env_type: shared_context

  # Knapsack with 100 items, heterogeneous weights
  knapsack_100:
    n_items: 100
    context_dim: 5
    capacity: 50.0
    noise_width: 0.25
    env_type: shared_context

  # Shortest path 8x8 grid
  shortest_path_8x8:
    grid_size: 8
    context_dim: 5
    noise_width: 0.25
    env_type: shared_context

  # Shortest path 20x20 grid
  shortest_path_20x20:
    grid_size: 20
    context_dim: 5
    noise_width: 0.25
    env_type: shared_context

  # Top-K toy problems (for toy dissection / Section 5 analysis)
  topk_8arm:
    n_arms: 8
    k: 2
    context_dim: 5
    cost_fn: sigmoid
    w_spread: 0.4
    env_type: topk

  # Linear cost variants (well-specified: linear features can fit perfectly)
  topk_8arm_linear:
    n_arms: 8
    k: 2
    context_dim: 5
    cost_fn: linear
    w_spread: 0.4
    env_type: topk



feedback_types:
  - semi_bandit
  - full

evaluation:
  quick:
    n_rounds: 1000
    n_seeds: 3
  full:
    n_rounds: 10000
    n_seeds: 10
  output_dir: "results/eval"

agent_defaults:
  lr: 0.001
  hidden_dim: 16
  hidden_dim_small: 16
  lambda_reg: 1.0
  alpha: 1.0
  beta: 1.0
  epsilon: 0.1
  decay_epsilon: true
  nonlinear: false
  neuralucb_max_history_size: 256
  neuralucb_batch_size: 16

ablations:
  kn_ratio:
    dataset: knapsack_32
    n_items: 32
    capacities: [4, 8, 12, 16, 20, 24, 28]
    n_rounds: 2500
    n_seeds: 5
    output_dir: "results/ablations/kn_ratio"

  exploration_strategy:
    datasets: [knapsack_32, shortest_path_8x8]
    n_rounds: 2500
    n_seeds: 5
    output_dir: "results/ablations/exploration"

  mechanism:
    datasets: [knapsack_32, shortest_path_8x8]
    n_rounds: 2500
    n_seeds: 5
    output_dir: "results/ablations/mechanism"

  feature_sharing:
    datasets: [knapsack_32, shortest_path_8x8]
    hidden_dims: [1, 4, 8, 16, 32, 64]
    n_rounds: 2500
    n_seeds: 5
    output_dir: "results/ablations/feature_sharing"

  context_variation:
    dataset: knapsack_32
    noise_widths: [0.0, 0.05, 0.1, 0.25, 0.5, 1.0]
    n_rounds: 2500
    n_seeds: 5
    output_dir: "results/ablations/context_variation"

  imputation_strategy:
    datasets: [knapsack_32, shortest_path_8x8]
    n_rounds: 2500
    n_seeds: 5
    output_dir: "results/ablations/imputation"

  imputation_samples:
    datasets: [knapsack_32, knapsack_100, shortest_path_8x8, shortest_path_20x20, portfolio_32]
    m_values: [1, 4, 8, 12]
    n_rounds: 2500
    n_seeds: 5
    tuning_dir: "results/tuning"
    output_dir: "results/ablations/imputation_samples"

  flip_set_collapse:
    datasets: [knapsack_32, shortest_path_8x8]
    n_rounds: 2500
    n_seeds: 5
    output_dir: "results/ablations/flip_set"

plotting:
  colors:
    Random: "gray"
    ThompsonSampling: "green"
    LinUCB: "orange"
    NeuralUCB: "red"
    BayesianSPO: "purple"
    FullSPO: "pink"
    DecisionUCB: "cyan"
    EpsilonGreedy: "gold"
    MSENeural: "coral"
  figsize:
    default: [10, 6]
    wide: [14, 6]
    tall: [10, 10]
    grid_2x2: [14, 10]
