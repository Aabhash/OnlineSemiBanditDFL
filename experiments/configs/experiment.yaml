experiment:
  name: "bandit_hp_tuning"
  output_dir: "results/tuning"

tuning:
  n_trials: 50
  n_seeds: 5
  n_rounds: 2500
  timeout_per_trial: 3600
  sampler_seed: 42
  default_lr: 0.01
  # Seed-aware pruning: prune trials that are clearly worse than median
  pruning:
    enabled: true
    min_seeds_before_pruning: 1  # Run at least 1 seed before pruning
    warmup_trials: 5             # Don't prune first N trials (need baseline)
    percentile_threshold: 75     # Prune if worse than this percentile of completed trials

validation:
  eval_interval: 25
  # For synthetic envs: generate validation set for monitoring (not HP selection)
  n_val_samples: 100
  seed: 42

compute:
  use_gpu: false
  track_time: true
  max_parallel_trials: 1

wandb:
  enabled: true
  entity: null
  log_interval: 10  # Log training metrics every N rounds
  # Separate projects for HP tuning vs final evaluation
  tuning:
    project: "constrained-bandits-tuning"
    tags: ["hp-tuning"]
  evaluation:
    project: "constrained-bandits-eval"
    tags: ["evaluation"]

storage:
  database: "sqlite:///results/tuning/optuna.db"
  results_dir: "results/tuning/trials"

# Disjoint seed sets to avoid data leakage between HP tuning and final evaluation
tuning_seeds: [0, 1, 2, 3, 4]      # Seeds for HP tuning (5 seeds)
evaluation_seeds: [100, 101, 102, 103, 104, 105, 106, 107, 108, 109]  # Seeds for final eval (10 seeds)

analysis:
  bootstrap:
    n_bootstrap: 10000
    confidence: 0.95
    seed: 42
  significance:
    alpha: 0.05

datasets:

  # Non-stationary knapsack (tests adaptation to changing reward dynamics)
  knapsack_drift_low_noise:
    n_items: 32
    context_dim: 5
    capacity: 20.0
    noise_width: 0.1
    nonstationarity: drift_and_shift
    drift_rate: 0.02
    shift_interval: 200
    shift_fraction: 0.1
    env_type: shared_context

  knapsack_drift_high_noise:
    n_items: 32
    context_dim: 5
    capacity: 20.0
    noise_width: 0.5
    nonstationarity: drift_and_shift
    drift_rate: 0.02
    shift_interval: 200
    shift_fraction: 0.1
    env_type: shared_context

  # Non-stationary shortest path (tests adaptation with path constraints)
  shortest_path_drift_low_noise:
    grid_size: 8
    data_type: synthetic
    context_dim: 20
    noise_std: 0.1
    nonstationarity: drift_and_shift
    drift_rate: 0.02
    shift_interval: 200
    shift_fraction: 0.1
    env_type: shared_context

  shortest_path_drift_high_noise:
    grid_size: 8
    data_type: synthetic
    context_dim: 20
    noise_std: 0.5
    nonstationarity: drift_and_shift
    drift_rate: 0.02
    shift_interval: 200
    shift_fraction: 0.1
    env_type: shared_context

  # Criteo Ad Bidding: real-world shared context benchmark
  criteo:
    n_campaigns: 100
    n_select: 10
    context_dim: 50
    subsample_rate: 1.0    # Full dataset (16M rows)
    n_estimators: 200      # XGBoost surrogate trees
    max_depth: 6           # XGBoost tree depth
    env_type: shared_context

  # NFL Fantasy: real-world per-arm context benchmark
  nfl:
    n_players: 494
    salary_cap: 50000
    context_dim: 14
    holdout_weeks: 4       # Last 4 weeks for evaluation (14-17)
    env_type: per_arm_context
    n_rounds: 1000         # Train with repetition over 13 weeks
    eval_metric: training  # HP selection uses training regret; holdout is for final reporting only

feedback_types:
  - semi_bandit
  - full

evaluation:
  quick:
    n_rounds: 300
    n_seeds: 3
  full:
    n_rounds: 10000
    n_seeds: 10
  output_dir: "results/eval"

agent_defaults:
  lr: 0.01
  hidden_dim: 64
  hidden_dim_small: 32
  lambda_reg: 1.0
  alpha: 1.0
  beta: 1.0
  gamma: 1.0
  nu: 1.0
  epsilon: 0.1
  decay_epsilon: true

ablations:
  observation_rate:
    player_counts: [30, 50, 75, 100, 150, 200, 300, 494]
    player_counts_full: [30, 40, 50, 75, 100, 125, 150, 200, 250, 300, 400, 494]
    player_counts_quick: [50, 100, 200, 494]
    n_rounds: 200
    n_rounds_full: 500
    n_rounds_quick: 100
    n_seeds: 3
    n_seeds_full: 5
    n_seeds_quick: 2
    ntk_methods: ["CN-UCB", "CN-TS"]
    bayesian_methods: ["PerArmBayesianSPO", "PerArmLinUCB", "PerArmTS"]
    output_dir: "results/ablations/obs_rate"
  imputation:
    n_rounds: 200
    n_seeds: 3
    output_dir: "results/ablations/imputation"
  uncertainty:
    n_rounds: 200
    n_seeds: 3
    output_dir: "results/ablations/uncertainty"
  training_paradigm:
    n_rounds: 200
    n_seeds: 3
    output_dir: "results/ablations/training_paradigm"

plotting:
  colors:
    Random: "gray"
    UCB-Bayesian: "blue"
    ThompsonSampling: "green"
    LinUCB: "orange"
    NeuralUCB: "red"
    BayesianSPO: "purple"
    FullSPO: "pink"
    DecisionUCB: "cyan"
    CN-UCB: "magenta"
    CN-TS: "darkblue"
    EpsilonGreedy: "gold"
    MSENeural: "coral"
    PerArmBayesianSPO: "purple"
    PerArmFullSPO: "pink"
    PerArmLinUCB: "orange"
    PerArmUCB: "blue"
    PerArmTS: "green"
    PerArmMSENeural: "coral"
    PerArmEpsilonGreedy: "gold"
    PerArmRandom: "gray"
    PerArmGreedy: "darkgray"
  figsize:
    default: [10, 6]
    wide: [14, 6]
    tall: [10, 10]
    grid_2x2: [14, 10]
