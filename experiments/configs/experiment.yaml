experiment:
  name: "bandit_hp_tuning"
  output_dir: "results/tuning"

tuning:
  n_trials: 50
  n_seeds: 3
  n_rounds: 2500
  timeout_per_trial: 3600
  sampler_seed: 42
  default_lr: 0.01
  # Seed-aware pruning: prune trials that are clearly worse than median
  pruning:
    enabled: true
    min_seeds_before_pruning: 0  # Run at least 1 seed before pruning
    warmup_trials: 5             # Don't prune first N trials (need baseline)
    percentile_threshold: 75     # Prune if worse than this percentile of completed trials
    # Late-stage pruning: only consider performance in the last fraction of rounds
    # This prevents pruning exploration-heavy configs before they can exploit
    use_late_stage: true         # If true, prune based on late-stage regret only
    late_stage_fraction: 0.75    # Consider only last 25% of rounds for pruning

validation:
  eval_interval: 25
  # For synthetic envs: generate validation set for monitoring (not HP selection)
  n_val_samples: 100
  seed: 42

compute:
  use_gpu: false
  track_time: true
  max_parallel_trials: 1

wandb:
  enabled: true
  entity: null
  log_interval: 10  # Log training metrics every N rounds
  # Separate projects for HP tuning vs final evaluation
  tuning:
    project: "constrained-bandits-tuning-new"
    tags: ["hp-tuning"]
  evaluation:
    project: "constrained-bandits-eval-new"
    tags: ["evaluation"]

storage:
  database: "sqlite:///results/tuning/optuna.db"
  results_dir: "results/tuning/trials"

# Disjoint seed sets to avoid data leakage between HP tuning and final evaluation
tuning_seeds: [0, 1, 2]            # Seeds for HP tuning (3 seeds)
evaluation_seeds: [100, 101, 102, 103, 104, 105, 106, 107, 108, 109]  # Seeds for final eval (10 seeds)

analysis:
  bootstrap:
    n_bootstrap: 10000
    confidence: 0.95
    seed: 42
  significance:
    alpha: 0.05

datasets:

  # Knapsack with 32 items, heterogeneous weights (uniform [1, 5])
  knapsack_32:
    n_items: 32
    context_dim: 5
    capacity: 20.0
    noise_width: 0.25
    env_type: shared_context

  # Knapsack with 100 items, heterogeneous weights
  knapsack_100:
    n_items: 100
    context_dim: 5
    capacity: 50.0
    noise_width: 0.25
    env_type: shared_context

  # Shortest path 8x8 grid
  shortest_path_8x8:
    grid_size: 8
    context_dim: 5
    noise_width: 0.25
    env_type: shared_context

  # Shortest path 20x20 grid
  shortest_path_20x20:
    grid_size: 20
    context_dim: 5
    noise_width: 0.25
    env_type: shared_context

  # Energy cost scheduling: binary scheduling over 24 hourly slots
  energy_24:
    min_periods: 11
    max_periods: 12
    min_consecutive: 2
    max_consecutive: 5
    context_dim: 0        # 0 = no PCA, use raw features
    noise_width: 0.0
    maximize: true        # maximize revenue
    data_dir: "data/Germany 2023-2025 Energy"
    context_type: yesterday_prices  # previous day's 24h price profile as context
    env_type: energy
    n_rounds: 1000
    skip_tuning: true

  # Criteo Ad Bidding: real-world shared context benchmark
  criteo:
    n_campaigns: 25
    n_select: 10
    context_dim: 50
    subsample_rate: 1.0    # Full dataset (16M rows)
    n_estimators: 500      # XGBoost surrogate trees
    max_depth: 10          # XGBoost tree depth
    env_type: shared_context

  # Criteo Hard: tighter constraint + amplified weights
  criteo_hard:
    n_campaigns: 25
    n_select: 4            # k/n = 0.16 (was 0.4)
    context_dim: 50
    subsample_rate: 1.0
    n_estimators: 500
    max_depth: 10
    weight_power: 2.0      # Amplify cost heterogeneity (~10-20x spread)
    env_type: shared_context


feedback_types:
  - semi_bandit
  - full

evaluation:
  quick:
    n_rounds: 1000
    n_seeds: 3
  full:
    n_rounds: 10000
    n_seeds: 10
  output_dir: "results/eval"

agent_defaults:
  lr: 0.001
  hidden_dim: 16
  hidden_dim_small: 16
  lambda_reg: 1.0
  alpha: 1.0
  beta: 1.0
  gamma: 1.0
  nu: 1.0
  epsilon: 0.1
  decay_epsilon: true
  nonlinear: false

ablations:
  observation_rate:
    player_counts: [30, 50, 75, 100, 150, 200, 300, 494]
    player_counts_full: [30, 40, 50, 75, 100, 125, 150, 200, 250, 300, 400, 494]
    player_counts_quick: [50, 100, 200, 494]
    n_rounds: 200
    n_rounds_full: 500
    n_rounds_quick: 100
    n_seeds: 3
    n_seeds_full: 5
    n_seeds_quick: 2
    ntk_methods: []
    bayesian_methods: []
    output_dir: "results/ablations/obs_rate"
  imputation:
    n_rounds: 200
    n_seeds: 3
    output_dir: "results/ablations/imputation"
  uncertainty:
    n_rounds: 200
    n_seeds: 3
    output_dir: "results/ablations/uncertainty"
  training_paradigm:
    n_rounds: 200
    n_seeds: 3
    output_dir: "results/ablations/training_paradigm"

  kn_ratio:
    dataset: knapsack_32
    n_items: 32
    capacities: [4, 8, 12, 16, 20, 24, 28]
    n_rounds: 2500
    n_seeds: 5
    output_dir: "results/ablations/kn_ratio"

  exploration_strategy:
    datasets: [knapsack_32, shortest_path_8x8]
    n_rounds: 2500
    n_seeds: 5
    output_dir: "results/ablations/exploration"

  feature_sharing:
    datasets: [knapsack_32, shortest_path_8x8]
    hidden_dims: [1, 4, 8, 16, 32, 64]
    n_rounds: 2500
    n_seeds: 5
    output_dir: "results/ablations/feature_sharing"

  context_variation:
    dataset: knapsack_32
    noise_widths: [0.0, 0.05, 0.1, 0.25, 0.5, 1.0]
    n_rounds: 2500
    n_seeds: 5
    output_dir: "results/ablations/context_variation"

  imputation_strategy:
    datasets: [knapsack_32, shortest_path_8x8]
    n_rounds: 2500
    n_seeds: 5
    output_dir: "results/ablations/imputation"

  flip_set_collapse:
    datasets: [knapsack_32, shortest_path_8x8]
    n_rounds: 2500
    n_seeds: 5
    output_dir: "results/ablations/flip_set"

plotting:
  colors:
    Random: "gray"
    UCB-Bayesian: "blue"
    ThompsonSampling: "green"
    LinUCB: "orange"
    NeuralUCB: "red"
    BayesianSPO: "purple"
    FullSPO: "pink"
    DecisionUCB: "cyan"
    EpsilonGreedy: "gold"
    MSENeural: "coral"
  figsize:
    default: [10, 6]
    wide: [14, 6]
    tall: [10, 10]
    grid_2x2: [14, 10]
