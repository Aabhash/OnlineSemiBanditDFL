# Stage-2 phased refinement search spaces.
# Backbone HPs (hidden_dim, lambda_reg, beta) are inherited from stage-1.
# Phased tuning can additionally override init_lr.

agents:

  BayesianSPO-Phased:
    init_lr:
      type: categorical
      choices: [0.0003, 0.001, 0.003]
    phase_length:
      type: categorical
      choices: [25, 50, 100]
    phase_epochs:
      type: categorical
      choices: [1, 3, 5]

  BayesianPFY-Phased:
    init_lr:
      type: categorical
      choices: [0.0003, 0.001, 0.003]
    phase_length:
      type: categorical
      choices: [25, 50, 100]
    phase_epochs:
      type: categorical
      choices: [1, 3, 5]

  NeuralUCB-Phased:
    init_lr:
      type: categorical
      choices: [0.0003, 0.001, 0.003]
    phase_length:
      type: categorical
      choices: [25, 50, 100]
    phase_epochs:
      type: categorical
      choices: [1, 3, 5]

  WeberBLL-Phased:
    init_lr:
      type: categorical
      choices: [0.0003, 0.001, 0.003]
    fisher_beta:
      type: float
      low: 0.001
      high: 1.0
      log: true
    phase_length:
      type: categorical
      choices: [25, 50, 100]
    phase_epochs:
      type: categorical
      choices: [1, 3, 5]
